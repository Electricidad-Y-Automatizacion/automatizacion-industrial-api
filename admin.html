<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin - Automatización Industrial</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 24px; }
    .box { max-width: 560px; margin: 40px auto; background: #111827; border: 1px solid #374151; border-radius: 14px; padding: 24px; }
    h1 { margin-top: 0; font-size: 24px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: #cbd5e1; }
    input, select, button { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; font-size: 15px; box-sizing: border-box; }
    input, select { background: #0b1220; color: #fff; }
    button { cursor: pointer; margin-top: 14px; border: none; font-weight: bold; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .result { margin-top: 18px; padding: 12px; border-radius: 10px; background: #0b1220; border: 1px solid #334155; white-space: pre-wrap; font-size: 14px; }
    .toplink{display:inline-block;margin-bottom:16px;color:#93c5fd;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <a class="toplink" href="index.html">← Volver a la web</a>
    <h1>Panel Admin</h1>

    <label for="email">Correo del alumno</label>
    <input type="email" id="email" placeholder="alumno@gmail.com" />

    <label for="courseId">Curso</label>
    <select id="courseId" onchange="syncCourseTitle()">
      <option value="logo8-basico" data-title="PLC LOGO 8 - BASICO">PLC LOGO 8 - BASICO</option>
      <option value="Electricidad-Industrial" data-title="Electricidad Industrial">Electricidad Industrial</option>
      <option value="Elect-Basica" data-title="ELECTRONEUMÁTICA BÁSICA">ELECTRONEUMÁTICA BÁSICA</option>
      <option value="Lg-Cableada" data-title="LOGICA CABLEADA">LOGICA CABLEADA</option>
    </select>

    <label for="courseTitle">Título del curso</label>
    <input type="text" id="courseTitle" readonly />

    <label for="planType">Plan</label>
    <select id="planType">
      <option value="monthly">Mensual</option>
      <option value="annual">Anual</option>
      <option value="lifetime">Ilimitado</option>
    </select>

    <button class="btn-primary" onclick="grantCourse()">Habilitar curso</button>
    <button class="btn-danger" onclick="revokeCourse()">Revocar curso</button>

    <div class="result" id="result">Esperando acción...</div>
  </div>

  <script>
    function syncCourseTitle() {
      const select = document.getElementById('courseId');
      const option = select.options[select.selectedIndex];
      document.getElementById('courseTitle').value = option.dataset.title || '';
    }

    async function grantCourse() {
      const email = document.getElementById('email').value.trim();
      const courseId = document.getElementById('courseId').value;
      const courseTitle = document.getElementById('courseTitle').value.trim();
      const planType = document.getElementById('planType').value;
      const result = document.getElementById('result');

      if (!email || !courseId || !courseTitle || !planType) {
        result.textContent = 'Completa todos los campos.';
        return;
      }

      result.textContent = 'Procesando...';

      try {
        const res = await fetch('/api/grant-course', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, courseId, courseTitle, planType })
        });

        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    }

    async function revokeCourse() {
      const email = document.getElementById('email').value.trim();
      const courseId = document.getElementById('courseId').value;
      const result = document.getElementById('result');

      if (!email || !courseId) {
        result.textContent = 'Completa el correo y el curso.';
        return;
      }

      result.textContent = 'Procesando...';

      try {
        const res = await fetch('/api/revoke-course', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, courseId })
        });

        const data = await res.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        result.textContent = 'Error: ' + err.message;
      }
    }

    syncCourseTitle();
  </script>
</body>
</html>
